<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        #dancer {
            display: none;
            width: 100px;
            margin: 20px;
        }
        button {
            background: #138254;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header align="center">
        <h1 style="color: #138254; font-weight: bold;">Hello World</h1>
        <p><em>Us after joining cs52</em></p>
    </header>
    
    <main align="center">
        <img src="https://media2.giphy.com/media/LHZyixOnHwDDy/giphy.gif" alt="Cat typing" height="250">
        
        <div>
            <button onclick="playMusic()">🎵 Play Music</button>
        </div>
        
        <img id="dancer" src="https://media.giphy.com/media/l378znZcUM7b6VDy8/giphy.gif" alt="Dancing robot">
        
        <audio id="music" src="https://gaana.com/song/twinkle-twinkle-22" loop></audio>
    </main>
</body>
</html>
